<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Nagrywaj fragmenty raportu z podróży: dźwięk, transkrypcja, lokalizacja, pogoda, zdjęcia i notatki.">
  <title>Dziennik</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css?v=202611011551">
  <script type="module" src="js/app.js?v=202611011551"></script>
</head>
<body>
  <header class="topbar">
    <a href="#/" class="icon-btn" id="back" hidden aria-label="Wróć do listy">‹</a>
    <h1>Dziennik</h1>
    <button type="button" class="icon-btn" id="settings-btn" aria-label="Ustawienia">⚙︎</button>
  </header>
  <div class="select-bar" id="select-bar" hidden>
    <button type="button" class="icon-btn" id="select-cancel" aria-label="Zakończ zaznaczanie">✕</button>
    <span id="select-count"></span>
    <button type="button" class="btn small" id="select-delete">🗑 Usuń</button>
  </div>

  <main id="view-list">
    <section class="recorder">
      <div class="langs" id="langs" role="radiogroup" aria-label="Język transkrypcji"></div>
      <button type="button" class="rec-btn" id="rec-btn" aria-label="Nagrywaj"><span class="rec-icon"></span></button>
      <div class="rec-meta" id="rec-meta" hidden>
        <span class="rec-dot"></span><span class="timer" id="timer">0:00</span>
        <span class="level" aria-hidden="true"><span id="level-bar"></span></span>
      </div>
      <div class="chips" id="rec-chips" hidden></div>
      <div class="live" id="live" hidden aria-live="polite"></div>
      <p class="speech-status" id="speech-status" hidden></p>
      <p class="speech-status" id="silence-note" hidden></p>
      <p class="hint" id="rec-hint"></p>
      <button type="button" class="link-btn" id="text-entry">✎ Wpis bez nagrania</button>
    </section>
    <div class="search" id="search-box">
      <input type="search" id="search" placeholder="Szukaj w tekście, notatkach i miejscach" autocomplete="off" enterkeyhint="search" aria-label="Szukaj">
    </div>
    <section class="list" id="list"></section>
  </main>

  <main id="view-detail" hidden></main>

  <dialog id="settings" class="sheet">
    <form method="dialog">
      <div class="sheet-head">
        <h2>Ustawienia</h2>
        <button type="button" class="icon-btn" id="share-app" aria-label="Udostępnij aplikację" title="Udostępnij aplikację"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M18 16a3 3 0 0 0-2.4 1.2l-6.7-3.4a3 3 0 0 0 0-1.6l6.7-3.4A3 3 0 1 0 15 7c0 .3 0 .5.1.8L8.4 11.2a3 3 0 1 0 0 3.6l6.7 3.4A3 3 0 1 0 18 16z"/></svg></button>
        <button class="icon-btn" aria-label="Zamknij">✕</button>
      </div>
      <div id="settings-body"></div>
    </form>
  </dialog>

  <dialog id="lightbox" class="lightbox">
    <form method="dialog"><button aria-label="Zamknij"><img alt=""></button></form>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
